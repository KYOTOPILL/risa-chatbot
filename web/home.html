<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>RiSA</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/home.css">
</head>
<body>
<div class="adm">
  <header class="top">
    <div class="brand"><span class="mark">RiSA</span></div>
    <div class="tools"><button class="lnk" id="find" type="button" hidden>ค้นหา<kbd id="findKey"></kbd></button><a id="who" class="me" href="/profile" aria-label="โปรไฟล์ของฉัน"></a><button class="lnk bell" id="bell" type="button" hidden>แจ้งเตือน<span class="n" id="bellN" hidden></span></button><a class="lnk" id="chatlink" href="/chat" hidden>แชทกับ AI</a><button class="lnk" id="logout" type="button" hidden>ออกจากระบบ</button></div>
    <div id="notes" class="notes" role="dialog" aria-label="แจ้งเตือน" hidden></div>
  </header>
  <main id="app"></main>
</div>
<!-- files tab markup: files.js mounts on it the first time a staff member opens the tab; it lives outside #app so tab changes keep it -->
<div id="files-root" hidden>
<h1 class="page-title">คลังเอกสาร</h1>
<p class="muted sub">เอกสารที่ AI ใช้ตอบคำถามในแชท จัดเป็นโฟลเดอร์ และเลือกไฟล์ที่ให้ดาวน์โหลดผ่านแชทได้</p>
<section class="card drive" id="list">
    <div class="between">
      <nav id="crumbs" class="crumbs" aria-label="โฟลเดอร์"></nav>
      <div class="tools">
        <button class="ghost" id="newdir" type="button">สร้างโฟลเดอร์</button>
        <button class="primary" id="pick" type="button">อัปโหลดไฟล์</button>
        <input id="files" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.pptx,.txt,.md">
        <input id="repl" type="file" hidden accept=".pdf,.docx,.xlsx,.pptx,.txt,.md">
      </div>
    </div>

    <div id="index" class="index" role="status"></div>

    <div id="sel" class="bulk" inert>
      <div class="bulkin">
        <span id="selcount" class="count"></span>
        <button class="ghost" id="shareon" type="button">เปิดให้ดาวน์โหลด</button>
        <button class="ghost" id="shareoff" type="button">ปิดการดาวน์โหลด</button>
        <button class="ghost" id="mvsel" type="button">ย้ายไป…</button>
        <button class="ghost danger" id="delsel" type="button">ลบ</button>
        <button class="ghost" id="clear" type="button">ยกเลิกการเลือก</button>
      </div>
    </div>

    <div class="flist" role="table">
      <div class="frow head" role="row">
        <div><input id="all" type="checkbox" aria-label="เลือกทั้งหมด"></div>
        <div>ชื่อเอกสาร</div><div class="sw">ดาวน์โหลดในแชท</div><div class="sz">ขนาดไฟล์</div><div class="dt">แก้ไขล่าสุด</div><div></div>
      </div>
      <div id="rows"><div class="frow sk"><div></div><div class="who"><span></span></div><div class="sw"></div><div class="sz"><span></span></div><div class="dt"><span></span></div><div></div></div><div class="frow sk"><div></div><div class="who"><span></span></div><div class="sw"></div><div class="sz"><span></span></div><div class="dt"><span></span></div><div></div></div><div class="frow sk"><div></div><div class="who"><span></span></div><div class="sw"></div><div class="sz"><span></span></div><div class="dt"><span></span></div><div></div></div></div>
    </div>
    <p id="empty" class="empty hidden">ยังไม่มีเอกสาร ลากไฟล์มาวางที่นี่เพื่ออัปโหลด</p>
  </section>

<div id="toast" class="toast hidden" role="status"><span id="tmsg"></span><button id="undo" class="link" type="button">เลิกทำ</button></div>

<dialog id="up">
  <form method="dialog">
    <p id="upmsg"></p>
    <label class="check"><input id="upshare" type="checkbox" checked> ให้ดาวน์โหลดผ่านแชทได้</label>
    <p class="muted">ปิดไว้ถ้าเป็นเอกสารภายในที่ใช้ตอบคำถามเท่านั้น เปลี่ยนทีหลังได้ในรายการไฟล์</p>
    <menu>
      <button class="ghost" value="cancel">ยกเลิก</button>
      <button class="primary" value="ok">อัปโหลด</button>
    </menu>
  </form>
</dialog>

<dialog id="mv">
  <form method="dialog">
    <label>ย้ายไปที่ <select id="dest"></select></label>
    <menu>
      <button class="ghost" value="cancel">ยกเลิก</button>
      <button class="primary" value="ok">ย้าย</button>
    </menu>
  </form>
</dialog>
</div>
<script src="/static/icons.js"></script>
<script src="/static/files.js"></script>
<script src="/static/todo.js"></script>
<script src="/static/forms.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
